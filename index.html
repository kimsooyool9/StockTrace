<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockTrace</title><link rel="stylesheet" href="./style.css"><link rel="manifest" href="./manifest.json"></head><body><header><h1>StockTrace</h1><span>주가와 뉴스의 연결 · 교육용 분석</span><button id="theme">테마</button></header><main><section class="controls"><label>데이터 파일 <input id="file" type="file" accept=".json"></label><label>검색 <input id="search" placeholder="종목명 / 티커"></label><select id="stock" aria-label="종목"></select><button id="watch">관심 종목</button><p id="watchlist"></p><p id="status" role="status">검증된 데이터 파일을 불러오세요.</p><label>분석일 <input id="date" type="date"></label><label>기간 <select id="range"><option value="30">30일</option><option value="90">90일</option><option value="365">1년</option></select></label><label>차트 <select id="mode"><option value="candle">캔들</option><option value="line">선</option></select></label><label>급등락 % <input id="threshold" type="number" min="1" max="100" value="5"></label><label>설명 <select id="level"><option>초급</option><option>중급</option><option>고급</option></select></label><button id="print">PDF / 인쇄</button><button id="export">데이터 백업</button></section><div class="layout"><section><h2>주가 및 거래량</h2><svg id="chart" viewBox="0 0 800 240" aria-label="주가 차트"></svg><p id="price"></p><h2>분석 보고서</h2><p id="report"></p><h2>기업 관계</h2><div id="relations"></div></section><section><h2>관련 뉴스</h2><div id="news"></div><h2>날짜 미확인 뉴스</h2><div id="undated"></div><h2>공시</h2><div id="filings"></div></section></div><section><h2>용어 사전</h2><p>거래량: 거래된 주식 수. 공시: 기업이 공개하는 공식 정보. 연관성 점수: 인과관계가 아닌 자료 관련성.</p></section></main><script type="module" src="./app.mjs"></script></body></html>
