<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockTrace</title><style>body{font:16px system-ui;margin:0;background:#f0f5fa;color:#18304b}header,main{padding:24px;max-width:1100px;margin:auto}section{background:white;border-radius:16px;padding:20px;margin:16px 0}button,input,select{font:inherit;padding:10px}svg{width:100%;height:240px}a{color:#1758a5}@media print{button,input{display:none}}</style><header><h1>StockTrace</h1><p>주가 · 뉴스 · 공시 분석 | 개발용 미리보기</p></header><main><section><label>검증된 데이터 JSON 불러오기 <input id="file" type="file" accept=".json"></label><p id="status">실제 데이터 미수집 — 임의 데이터는 표시하지 않습니다.</p><select id="stock" aria-label="종목"></select><input id="date" type="date" aria-label="분석 날짜"><button id="print">보고서 인쇄</button></section><section><h2>주가 추이</h2><svg id="chart" viewBox="0 0 800 240" role="img" aria-label="종가 차트"></svg></section><section><h2>관련 뉴스</h2><div id="news"></div></section><section><h2>공시</h2><div id="filings"></div></section></main><script type="module" src="./app.mjs"></script></html>
